<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q.I.Z — timer e parole per giochi dal vivo</title>
<meta name="description" content="Timer e schermate per giochi a squadre dal vivo: regia su un monitor, proiezione sull'altro. Funziona offline, in un file solo.">
<style id="stileRegia">:root{
  --fondo:#13111C;--pannello:#1C1929;--campo:#100E18;--riga:#2C283D;--sopra:#262236;
  --testo:#EEEAF4;--tenue:#9C95AE;--acc:#F5169B;--accSopra:#FF4DB5;--suAcc:#1B0010;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--riga);color:var(--testo);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;grid-template-columns:minmax(400px,2fr) 3fr;grid-template-rows:auto 1fr;gap:1px}
.colonna{background:var(--fondo);overflow-y:auto;padding:20px 24px 80px;min-height:0}
h1{font:700 20px/1.2 system-ui;margin:0 0 16px}
h2{font:700 12px/1 system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);margin:0 0 12px}
.nota{font-size:13px;color:var(--tenue);margin:8px 0 0}

/* ---------- barra in alto ---------- */
.barraAlta{grid-column:1/-1;display:flex;align-items:center;gap:10px;
  background:var(--pannello);padding:10px 24px}
.marchio{font:800 17px/1 system-ui;letter-spacing:.02em;margin-right:auto}
.versione{font-size:12px;font-weight:500;color:var(--tenue);margin-left:6px}
.barraAlta .nota{margin:0;max-width:420px;text-align:right}
.barraAlta select{width:auto;padding:7px 8px;font-size:13px}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;background:var(--riga);border-radius:8px;
  padding:9px 14px;font:600 14px/1 system-ui}
.menu summary::-webkit-details-marker{display:none}
.menu summary::after{content:" ▾";color:var(--tenue)}
.menu summary:hover{background:#3A3550}
.menuTendina{position:absolute;right:0;top:calc(100% + 6px);z-index:10;min-width:220px;
  display:flex;flex-direction:column;gap:2px;padding:6px;
  background:var(--pannello);border:1px solid var(--riga);border-radius:var(--r);
  box-shadow:0 12px 32px #0008}
.menuTendina button,.menuTendina a{background:none;text-align:left;padding:10px 12px;
  color:var(--testo);text-decoration:none;font:500 14px/1 system-ui;border-radius:6px}
.menuTendina button:hover,.menuTendina a:hover{background:var(--riga)}

/* ---------- linguette ---------- */
.linguette{display:flex;gap:4px;padding:4px;background:var(--pannello);border-radius:var(--r);margin-bottom:16px}
.linguette button{flex:1;background:none;color:var(--tenue);padding:10px 8px}
.linguette button:hover{color:var(--testo);background:var(--sopra)}
.linguette button[aria-selected=true]{background:var(--riga);color:var(--testo)}

/* ---------- campi e bottoni ---------- */
.scheda{background:var(--pannello);border-radius:var(--r);padding:16px;margin-bottom:12px}
.campo{margin-bottom:12px}
label{display:block;font-size:13px;color:var(--tenue);margin-bottom:5px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--campo);color:var(--testo);
  border:1px solid var(--riga);border-radius:8px;padding:9px 11px;font:inherit}
textarea{min-height:130px;resize:vertical;font-size:14px;line-height:1.6}
input:focus,textarea:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=checkbox]{width:auto;height:16px;accent-color:var(--acc);cursor:pointer}
input[type=color]{width:38px;height:38px;flex:none;padding:2px;border:1px solid var(--riga);
  border-radius:9px;background:var(--campo);cursor:pointer}
.duo{display:grid;grid-template-columns:1fr 130px;gap:10px}
.duo3{display:flex;gap:10px}
button{background:var(--riga);color:var(--testo);border:0;border-radius:8px;
  padding:9px 14px;font:600 14px/1 system-ui;cursor:pointer}
button:hover{background:#3A3550}
button.forte{background:var(--acc);color:var(--suAcc)}
button.forte:hover{background:var(--accSopra)}
button.quieto{background:transparent;color:var(--tenue);padding:6px 8px}
button.quieto:hover{color:var(--testo);background:var(--riga)}
button[disabled]{opacity:.35;cursor:not-allowed}
button.aggiungi{width:100%;background:none;border:1px dashed var(--riga);color:var(--tenue);padding:12px}
button.aggiungi:hover{border-color:var(--acc);color:var(--testo)}
.bottoni{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

/* ---------- giochi e round ---------- */
.pieghevole{background:var(--pannello);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.testata{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none}
.testata:hover{background:var(--sopra)}
.freccia{color:var(--tenue);font-size:10px;width:10px;flex:none;transition:transform .15s}
.pieghevole.aperto .freccia{transform:rotate(90deg)}
.titolo-b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%}
.sommario{font-size:13px;color:var(--tenue);margin-left:auto;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;padding-left:8px}
.testata button{padding:5px 9px;font-size:13px;line-height:1;flex:none;background:transparent;color:var(--tenue)}
.testata button:hover{background:var(--riga);color:var(--testo)}
.testata button.gioca{color:var(--acc)}
.corpo{padding:4px 14px 14px;border-top:1px solid var(--riga)}
.corpo > .campo:first-child{margin-top:12px}
.gruppo{margin:16px 0 12px;padding-top:14px;border-top:1px solid var(--riga)}
.gruppo .pieghevole{background:var(--campo);margin-bottom:8px}
.gruppo .corpo{padding-top:0}

/* ---------- squadre e aspetto ---------- */
.temi{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.temi button{display:flex;flex-direction:column;padding:0;overflow:hidden;background:var(--campo);
  border:2px solid var(--riga)}
.temi button:hover{border-color:var(--acc);background:var(--campo)}
.temi .mini{position:relative;height:56px;display:flex;align-items:center;justify-content:center;
  font:700 20px/1 system-ui}
.temi .mini::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;
  background:linear-gradient(90deg,var(--a),var(--b))}
.temi .mini.piatto::before{display:none}
.temi .nome{padding:8px 4px;font-size:12px}
.riga-squadra .nota{margin:0;white-space:nowrap}
.ripr{position:relative}
.ripr > .ripristina{position:absolute;right:0;top:-5px;padding:4px 8px;font-size:15px;background:none;color:var(--acc)}
.ripr > .ripristina:hover{background:var(--riga)}
.ripr > .riga-squadra ~ .ripristina{top:6px}
.ripr > .bottoni ~ .ripristina{top:2px}
.ripr > .spunta ~ .ripristina{top:-4px}
.scheda > .ripr:last-child > :first-child{margin-bottom:0}
.rigaTema{align-items:center;justify-content:space-between;margin-top:4px}
.rigaTema .nota{margin:0}
.riga-squadra{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.riga-squadra input[type=text]{flex:1}
.tavolozza{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px 48px}
.tavolozza button{width:20px;height:20px;padding:0;border-radius:50%;border:2px solid transparent}
.tavolozza button:hover{border-color:var(--testo)}
.pallino{width:12px;height:12px;border-radius:50%;flex:none}
.spunta{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:14px;color:var(--testo);cursor:pointer}
.cursore{display:grid;grid-template-columns:1fr 56px;gap:10px;align-items:center}
.cursore output{font-size:13px;color:var(--tenue);text-align:right;font-variant-numeric:tabular-nums}
.scheda > :last-child{margin-bottom:0}

table.tasti{width:100%;border-collapse:collapse;font-size:14px}
table.tasti td{padding:6px 0;border-bottom:1px solid var(--riga)}
table.tasti tr:last-child td{border-bottom:0}
kbd{display:inline-block;min-width:40px;text-align:center;background:var(--campo);
  border:1px solid var(--riga);border-bottom-width:2px;border-radius:5px;
  padding:4px 7px;font:600 12px/1 ui-monospace,Menlo,monospace;color:var(--testo)}
kbd.ascolto{border-color:var(--acc);color:var(--acc)}

/* ---------- in diretta ---------- */
.testaColonna{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.testaColonna h1{margin:0;flex:1}
.suggerimento{margin:0 0 16px;text-align:right}
.live{position:sticky;top:-20px;background:var(--fondo);padding:20px 0 16px;margin-top:-20px;z-index:2}
.stato{display:flex;align-items:center;gap:16px;background:var(--pannello);border-radius:var(--r);
  border-left:6px solid var(--riga);padding:16px 20px;margin-bottom:12px}
.stato > div:first-child{flex:1;min-width:0}
.stato .chi{font:700 20px/1.25 system-ui}
.stato .nota{margin:4px 0 0}
.stato .tempo{font:700 52px/1 system-ui;font-variant-numeric:tabular-nums}
.stato .tempo.scarso{color:#FFB406}
.stato .tempo.finito{color:#FF5A4A}
.comandi{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px}
.comandi button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 6px}
.comandi kbd{min-width:0;background:#0003;border-color:#0000}
.comandi button.forte kbd{color:var(--suAcc)}
#cAvvia{grid-column:1/-1;font-size:16px;flex-direction:row;justify-content:center;gap:12px;padding:14px}
.correggi{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.correggi span{font-size:13px;color:var(--tenue);margin-right:4px}
.correggi input{width:80px;text-align:center}

.palco{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start;margin-top:8px}
.anteprima{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden}
.corrente{background:var(--pannello);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.corrente .ora{font:700 26px/1.2 system-ui;word-break:break-word;min-height:32px}
.corrente .poi{margin-top:8px;font-size:14px;color:var(--tenue);word-break:break-word}
ol.voci{list-style:none;margin:0;padding:0;max-height:320px;overflow-y:auto}
ol.voci li{display:flex;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:14px}
ol.voci li:hover{background:var(--pannello)}
ol.voci li .n{color:var(--tenue);font-variant-numeric:tabular-nums;min-width:22px}
ol.voci li.viva,ol.voci li.viva .n{color:#fff}
ol.voci li.passata{color:var(--tenue)}
ol.voci li .ris{color:var(--tenue);font-style:italic}
ol.voci li.viva .ris{color:#fffc}

.avviso{background:#3A1A10;border:1px solid #6A3520;color:#FFD7BC;
  border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.avviso button{margin:8px 8px 0 0}

@media (max-width:1100px){
  .palco{grid-template-columns:1fr}
  .comandi{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-rows:auto}
  html,body{height:auto}
  .barraAlta{flex-wrap:wrap}
}
</style>

.schermo{
  position:absolute;top:50%;left:50%;width:1280px;height:720px;
  transform:translate(-50%,-50%) scale(var(--k,1));transform-origin:center;
  overflow:hidden;
  background:var(--sfondo,#F4F2EE);
  color:var(--testo,#2B2F38);
  font-family:var(--carattere,TitoloBase),TitoloBase,system-ui,sans-serif;
  font-weight:var(--peso,400);
  font-style:var(--corsivo,normal);
  letter-spacing:var(--spaziatura,0em);
  --squadra:#7A8194;
  --g1:#8A90A2;--g2:#6E7488;--g3:#6E7488;--g4:#A8AEBD;
  --maiuscolo:none;
}

/* ---------- immagine di sfondo, con un velo del colore di sfondo sopra ---------- */
.fondo-img{position:absolute;inset:0;background:center/cover no-repeat}
.fondo-img::after{content:"";position:absolute;inset:0;background:var(--sfondo,#F4F2EE);opacity:var(--velo,0)}

/* ---------- onde ---------- */
.onde{position:absolute;left:0;width:100%;height:var(--altezzaOnde,170px);pointer-events:none}
.onde-su{top:0}
.onde-giu{bottom:0;transform:scaleY(-1)}
.onde .filo{fill:none;stroke:var(--sfondo,#F4F2EE);stroke-width:4;opacity:.9}
.schermo.senzaOnde .onde{display:none}
.schermo[data-fase=gioco] .onde-giu{height:calc(var(--altezzaOnde,170px) * .65)}
.stopA{stop-color:var(--g1)} .stopB{stop-color:var(--g2)}
.stopC{stop-color:var(--g3)} .stopD{stop-color:var(--g4)}

/* ---------- granelli ---------- */
.granelli{position:absolute;width:300px;height:300px;pointer-events:none;
  background-image:radial-gradient(currentColor 2.4px,transparent 2.6px);
  background-size:26px 26px;opacity:.4}
.granelli.gsu{top:150px;left:-40px;color:var(--g1);
  -webkit-mask-image:radial-gradient(60% 60% at 70% 70%,#000,transparent);
  mask-image:radial-gradient(60% 60% at 70% 70%,#000,transparent)}
.granelli.ggiu{bottom:150px;right:-40px;color:var(--g4);
  -webkit-mask-image:radial-gradient(60% 60% at 30% 30%,#000,transparent);
  mask-image:radial-gradient(60% 60% at 30% 30%,#000,transparent)}
.schermo.senzaGranelli .granelli{display:none}

/* ---------- quadri ---------- */
.quadro{position:absolute;inset:0;display:none}
.schermo[data-fase=tappo]  .q-tappo{display:flex}
.schermo[data-fase=finale] .q-tappo{display:flex}
.schermo[data-fase=pronto] .q-pronto{display:flex}
.schermo[data-fase=gioco]  .q-gioco{display:flex}

/* ---------- tappo ---------- */
.q-tappo{flex-direction:column;align-items:center;justify-content:center;padding:120px 60px;gap:0}
.marchio-grande{width:calc(420px * var(--scalaLogo,1));height:auto;max-height:64%;object-fit:contain;
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.14))}
.marchio-grande[hidden]{display:none}
.tappo-testo{margin:26px 0 0;font-size:calc(56px * var(--scalaTappoTesto,1));
  line-height:1.05;text-align:center;max-width:1020px;text-transform:var(--maiuscolo,none)}
.tappo-testo:empty{display:none}

/* ---------- logo d'angolo ---------- */
.marchio-angolo{position:absolute;width:calc(116px * var(--scalaAngolo,1));height:auto}
.schermo[data-angolo="alto-destra"]  .marchio-angolo{right:62px;top:84px}
.schermo[data-angolo="alto-sinistra"] .marchio-angolo{left:62px;top:84px}
.schermo[data-angolo="basso-destra"]  .marchio-angolo{right:62px;bottom:calc(var(--altezzaOnde,170px) * .65 + 22px)}
.schermo[data-angolo="basso-sinistra"] .marchio-angolo{left:62px;bottom:calc(var(--altezzaOnde,170px) * .65 + 116px)}
.schermo.senzaAngolo .marchio-angolo{display:none}

/* ---------- targa squadra ---------- */
.targa{position:absolute;left:62px;right:62px;top:60px;display:flex;align-items:center;justify-content:center}
.schermo[data-targa=sinistra] .targa{justify-content:flex-start}
.schermo[data-targa=destra] .targa{justify-content:flex-end}
.targa b{background:var(--squadra);color:var(--sfondo,#F4F2EE);font-weight:400;
  font-size:34px;line-height:1;padding:13px 26px 11px;border-radius:999px;
  text-transform:var(--maiuscolo,none)}
.targa b:empty{display:none}

/* ---------- pronto / solo timer ---------- */
.q-pronto{flex-direction:column;align-items:center;justify-content:center;padding:150px 60px}
.orologio-grande{font-size:calc(276px * var(--scalaTimer,1));line-height:.86;
  font-variant-numeric:tabular-nums;color:var(--testo,#2B2F38)}

/* ---------- gioco ---------- */
.parola{position:absolute;left:90px;right:90px;top:202px;height:268px;
  display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.parola span{display:block;max-width:100%;line-height:1.04;
  overflow-wrap:break-word;hyphens:none;text-transform:var(--maiuscolo,none)}
.parola.risposta span{color:var(--risposta,var(--squadra))}
.parola.vuota span{opacity:.45}

.chip-tempo{position:absolute;font-size:calc(104px * var(--scalaTimer,1));line-height:1;
  font-variant-numeric:tabular-nums;color:var(--testo,#2B2F38)}
.schermo[data-timer="basso-destra"]   .chip-tempo{right:66px;bottom:122px}
.schermo[data-timer="basso-sinistra"] .chip-tempo{left:66px;bottom:122px}
.schermo[data-timer="alto-destra"]    .chip-tempo{right:66px;top:70px}
.schermo[data-timer="centro-basso"]   .chip-tempo{left:0;right:0;bottom:116px;text-align:center}

.barra{position:absolute;left:0;right:0;bottom:0;height:12px;
  background:color-mix(in srgb, var(--testo,#2B2F38) 14%, transparent);display:none}
.schermo[data-fase=gioco] .barra,.schermo[data-fase=pronto] .barra{display:block}
.barra i{display:block;height:100%;width:100%;background:var(--squadra)}
.schermo.senzaBarra .barra{display:none}

/* ---------- soglie ---------- */
.schermo.avviso  .orologio-grande,.schermo.avviso  .chip-tempo{color:var(--giallo,#FFB406)}
.schermo.allarme .orologio-grande,.schermo.allarme .chip-tempo{color:var(--rosso,#E02B20)}
.schermo.allarme .barra i{background:var(--rosso,#E02B20)}

@media (prefers-reduced-motion:no-preference){
  .schermo.finito .orologio-grande,.schermo.finito .chip-tempo{animation:batti .8s steps(2,end) infinite}
}
@keyframes batti{50%{opacity:.2}}

/* ---------- entrata delle parole ---------- */
@media (prefers-reduced-motion:no-preference){
  .schermo[data-transizione=dissolvenza] .parola span.entra{animation:entraDissolvenza .4s ease-out}
  .schermo[data-transizione=scorrimento] .parola span.entra{animation:entraScorrimento .45s cubic-bezier(.2,.8,.2,1)}
  .schermo[data-transizione=pop] .parola span.entra{animation:entraPop .35s cubic-bezier(.3,1.5,.5,1)}
}
@keyframes entraDissolvenza{from{opacity:0}}
@keyframes entraScorrimento{from{opacity:0;transform:translateY(80px)}}
@keyframes entraPop{from{opacity:0;transform:scale(.7)}}

/* ---------- firma dei realizzatori, sempre presente ---------- */
.credito{position:absolute;left:62px;display:flex;align-items:center;gap:12px;
  bottom:calc(var(--altezzaOnde,170px) + 18px);pointer-events:none;opacity:.72}
.schermo[data-fase=gioco] .credito{bottom:calc(var(--altezzaOnde,170px) * .65 + 18px)}
.schermo.senzaOnde .credito{bottom:34px}
.credito img{width:100px;height:auto;display:block}
.credito span{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:600;font-size:21px;letter-spacing:.01em;color:var(--testo,#2B2F38);
  text-transform:none;font-style:normal}
</style>

let LINGUA = "it";
function linguaAttiva(){ return LINGUA; }
function impostaLingua(L){
  LINGUA = (L === "en") ? "en" : "it";
  if(typeof cfg === "object" && cfg) cfg.lingua = LINGUA;
}

function tr(chiave, ...valori){
  const L = linguaAttiva();
  let s = chiave;
  if(L !== "it" && LINGUE[L] && LINGUE[L][chiave] != null) s = LINGUE[L][chiave];
  valori.forEach(v => { s = s.replace("%s", v); });
  return s;
}

function tOpz(oggetto){
  const r = {};
  for(const k in oggetto) r[k] = tr(oggetto[k]);
  return r;
}

function locale(){ return linguaAttiva() === "en" ? "en-GB" : "it-IT"; }

function traduciPagina(){
  document.documentElement.lang = linguaAttiva();
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = tr(e.dataset.t); });
  document.querySelectorAll("[data-tp]").forEach(e => { e.placeholder = tr(e.dataset.tp); });
  document.title = linguaAttiva() === "en"
    ? "Q.I.Z — timer and words for live games"
    : "Q.I.Z — timer e parole per giochi dal vivo";
}

/* ---------------- utilità ---------------- */

function mmss(ms){
  const t = Math.max(0, Math.ceil(ms/1000));
  return String(Math.floor(t/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0");
}

function leggiTempo(txt){
  if(txt == null) return null;
  const s = String(txt).trim();
  if(!s) return null;
  if(s.includes(":")){
    const [m, x] = s.split(":");
    const mm = parseInt(m,10), ss = parseInt(x,10);
    if(isNaN(mm) || isNaN(ss)) return null;
    return mm*60 + ss;
  }
  const n = parseInt(s,10);
  return isNaN(n) ? null : n;
}

const scriviTempo = sec =>
  sec >= 60 ? Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0") : String(sec);

function vociDi(testo){
  return String(testo || "").split("\n").map(r => r.trim()).filter(Boolean).map(r => {
    const i = r.indexOf("|");
    return i < 0 ? {d:r, r:""} : {d:r.slice(0,i).trim(), r:r.slice(i+1).trim()};
  });
}

function nomeTasto(code){
  const m = {Space:"Spazio",Escape:"Esc",ArrowRight:"→",ArrowLeft:"←",ArrowUp:"↑",ArrowDown:"↓",
             Enter:"Invio",Equal:"+",Minus:"−",NumpadAdd:"Num +",NumpadSubtract:"Num −"};
  if(m[code]) return tr(m[code]);
  if(!code) return "—";
  if(code.startsWith("Key")) return code.slice(3);
  if(code.startsWith("Digit")) return code.slice(5);
  if(code.startsWith("Numpad")) return "Num " + code.slice(6);
  return code;
}

function mescola(colore, verso, quanto){
  const n = h => [0,2,4].map(i => parseInt(h.replace("#","").slice(i,i+2),16));
  const [r1,g1,b1] = n(colore), [r2,g2,b2] = n(verso);
  const m = (a,z) => Math.round(a + (z-a)*quanto).toString(16).padStart(2,"0");
  return "#" + m(r1,r2) + m(g1,g2) + m(b1,b2);
}

/* luminosità percepita, per avvisare se il contrasto è troppo basso */
function luce(hex){
  const [r,g,b] = [0,2,4].map(i => parseInt(hex.replace("#","").slice(i,i+2),16)/255)
    .map(v => v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4));
  return .2126*r + .7152*g + .0722*b;
}
function contrasto(a, b){
  const x = luce(a), y = luce(b);
  return (Math.max(x,y) + .05) / (Math.min(x,y) + .05);
}

/* ---------------- suono ---------------- */

let ctxAudio = null;
function suona(tipo, volume){
  if(!tipo || tipo === "nessuno") return;
  try{
    const v = Math.max(0, Math.min(1, (volume ?? 60) / 100));
    const file = SUONI_FILE[tipo] || (suonoUtente(tipo) || {}).dati;
    if(file){
      const a = new Audio(file);
      a.volume = v;
      a.play().catch(() => {});
      return;
    }
    ctxAudio = ctxAudio || new (window.AudioContext || window.webkitAudioContext)();
    if(ctxAudio.state === "suspended") ctxAudio.resume();
    const t0 = ctxAudio.currentTime;
    const nota = (freq, inizio, durata, onda, picco) => {
      const o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
      o.type = onda; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0 + inizio);
      g.gain.exponentialRampToValueAtTime(Math.max(.0002, picco * v), t0 + inizio + .01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + inizio + durata);
      o.connect(g).connect(ctxAudio.destination);
      o.start(t0 + inizio); o.stop(t0 + inizio + durata + .02);
    };
    if(tipo === "bip"){ nota(880,0,.12,"square",.3); nota(880,.18,.12,"square",.3); nota(1320,.36,.22,"square",.3); }
    else if(tipo === "campana"){ nota(1046,0,1.1,"sine",.45); nota(1568,.02,.9,"sine",.2); }
    else if(tipo === "buzzer"){ nota(150,0,.65,"sawtooth",.28); nota(110,0,.65,"square",.2); }
  }catch(e){ /* audio non disponibile: pazienza */ }
}

function agganciaSchermo(radice, doc){
  radice.innerHTML = STRUTTURA;
  const s = radice.querySelector(".schermo");
  const rif = {
    doc, radice, schermo: s,
    fondoImg:   s.querySelector(".fondo-img"),
    imgGrande:  s.querySelector(".marchio-grande"),
    imgAngolo:  [...s.querySelectorAll(".marchio-angolo")],
    tappoTesto: s.querySelector(".tappo-testo"),
    squadraNome:s.querySelector(".squadra-nome"),
    orologio:   s.querySelector(".orologio-grande"),
    chip:       s.querySelector(".chip-tempo"),
    parola:     s.querySelector(".parola"),
    parolaTesto:s.querySelector(".parola span"),
    barra:      s.querySelector(".barra i"),
    ultimaVoce: undefined,
  };
  schermi.push(rif);
  tappoSporco = true; fontSporco = true;
  scala(rif);
  if(doc.fonts && doc.fonts.ready) doc.fonts.ready.then(riadattaTutti);
  return rif;
}

function scala(rif){
  const w = rif.doc === document ? rif.radice.clientWidth  : rif.doc.documentElement.clientWidth;
  const h = rif.doc === document ? rif.radice.clientHeight : rif.doc.documentElement.clientHeight;
  rif.schermo.style.setProperty("--k", Math.min(w/1280, h/720));
}
const scalaTutti = () => schermi.forEach(scala);
addEventListener("resize", scalaTutti);

function cssFont(t){
  const f = t.font;
  if(!f.dati) return "";
  return `@font-face{font-family:Utente;src:url("${f.dati}");font-display:block}`;
}

function applicaFont(doc, t){
  let st = doc.getElementById("fontUtente");
  if(!st){
    st = doc.createElement("style");
    st.id = "fontUtente";
    doc.head.appendChild(st);
  }
  st.textContent = cssFont(t);
}

function adatta(s, tema){
  const box = s.parola, t = s.parolaTesto;
  if(!t.textContent) return;
  const max = Math.round(150 * (tema.font.scala / 100));
  let lo = 20, hi = Math.max(24, max), best = 20;
  while(lo <= hi){
    const m = (lo + hi) >> 1;
    t.style.fontSize = m + "px";
    if(t.offsetHeight <= box.clientHeight && t.scrollWidth <= box.clientWidth){ best = m; lo = m + 1; }
    else hi = m - 1;
  }
  t.style.fontSize = best + "px";
}

function riadattaTutti(){
  schermi.forEach(s => { s.ultimaVoce = undefined; });
  dipingi();
}

function faseCorrente(){
  const r = live;
  if(!r) return "tappo";
  if(r.mostraTappo || r.mostraFinale) return "tappo";
  if(r.iniziato && r.template !== "timer") return "gioco";
  return "pronto";
}

function dipingi(){
  const r = live;
  const fase = faseCorrente();
  const frazione = r ? r.restoMs / r.durataMs : 1;
  const sec = r ? r.restoMs / 1000 : 999;
  const avviso  = r && sec <= cfg.vista.sogliaGialla && sec > cfg.vista.sogliaRossa;
  const allarme = r && sec <= cfg.vista.sogliaRossa;
  const finito  = r && r.restoMs <= 0;
  const testo = r ? mmss(r.restoMs) : mmss(0);

  /* cosa mostra il quadro "tappo": tappo normale o schermata di fine */
  let logoT = cfg.tappo.mostraLogo ? cfg.tappo.logo : "";
  let testoT = cfg.tappo.testo;
  if(r && r.mostraFinale && r.finale.schermo === "custom"){
    logoT = r.finale.logo || "";
    testoT = r.finale.testo || "";
  }

  const tLive = r ? temaDi(cfg.giochi[r.gi]) : cfg.tema;
  const gm = giocoInModifica();
  $("#statoTempo").textContent = r ? testo : "--:--";

  for(const s of schermi){
    /* a round fermo, l'anteprima mostra il tema che si sta modificando */
    const t = !r && s.doc === document && gm && !$("#pAspetto").hidden ? temaDi(gm) : tLive;
    const el = s.schermo;
    el.dataset.transizione = t.transizione;
    el.dataset.fase = fase;
    el.dataset.angolo = cfg.angolo.posizione;
    el.dataset.timer = cfg.vista.timerPosizione;
    el.dataset.targa = cfg.vista.targa;
    el.classList.toggle("avviso", !!avviso);
    el.classList.toggle("allarme", !!allarme);
    el.classList.toggle("finito", !!finito);
    el.classList.toggle("senzaOnde", !t.onde);
    el.classList.toggle("senzaGranelli", !t.granelli);
    el.classList.toggle("senzaBarra", !t.barra);
    el.classList.toggle("senzaAngolo", !cfg.angolo.mostra);

    const st = el.style;
    st.setProperty("--sfondo", t.sfondo);
    st.setProperty("--testo", t.testo);
    st.setProperty("--giallo", t.giallo);
    st.setProperty("--rosso", t.rosso);
    st.setProperty("--velo", t.immagine ? t.velo / 100 : 0);
    st.setProperty("--risposta", t.risposta || "var(--squadra)");
    st.setProperty("--altezzaOnde", t.altezzaOnde + "px");
    st.setProperty("--scalaLogo", cfg.tappo.scalaLogo / 100);
    st.setProperty("--scalaTappoTesto", cfg.tappo.scalaTesto / 100);
    st.setProperty("--scalaAngolo", cfg.angolo.scala / 100);
    st.setProperty("--scalaTimer", cfg.vista.timerScala / 100);
    st.setProperty("--peso", t.font.peso);
    st.setProperty("--corsivo", t.font.corsivo ? "italic" : "normal");
    st.setProperty("--maiuscolo", t.font.maiuscolo ? "uppercase" : "none");
    st.setProperty("--spaziatura", (t.font.spaziatura / 100) + "em");
    st.setProperty("--carattere", t.font.dati ? "Utente" : "TitoloBase");

    if(!r || !r.colore || (fase === "tappo" && !r.mostraFinale)){
      const c = t.ondeColori;
      st.setProperty("--g1", c[0]); st.setProperty("--g2", c[1]);
      st.setProperty("--g3", c[2]); st.setProperty("--g4", c[3]);
      st.setProperty("--squadra", c[1]);
    } else {
      const c = r.colore;
      st.setProperty("--squadra", c);
      st.setProperty("--g1", mescola(c, t.testo, .30));
      st.setProperty("--g2", c);
      st.setProperty("--g3", c);
      st.setProperty("--g4", mescola(c, t.sfondo, .45));
    }

    if(fontSporco) applicaFont(s.doc, t);

    if(tappoSporco){
      s.fondoImg.style.backgroundImage = t.immagine ? `url("${t.immagine}")` : "";
      s.imgGrande.src = logoT || "";
      s.imgGrande.hidden = !logoT;
      s.imgAngolo.forEach(i => { i.src = cfg.angolo.logo || ""; i.hidden = !cfg.angolo.logo; });
      s.tappoTesto.textContent = testoT || "";
      s.squadraNome.textContent = r ? r.squadra : "";
    }

    s.orologio.textContent = testo;
    s.chip.textContent = testo;
    s.barra.style.width = Math.max(0, Math.min(1, frazione) * 100) + "%";

    let voce = "", classe = "parola";
    if(r && r.iniziato && r.template !== "timer"){
      const v = r.indice >= 0 ? r.elenco[r.indice] : null;
      if(!v){ voce = tr("Scaletta vuota"); classe = "parola vuota"; }
      else if(r.mostraRisposta){ voce = v.r || v.d; classe = "parola risposta"; }
      else voce = v.d;
    }
    s.parola.className = classe;
    if(s.ultimaVoce !== voce){
      const nuova = s.parolaTesto.textContent !== voce;
      s.parolaTesto.textContent = voce; s.ultimaVoce = voce; adatta(s, t);
      if(nuova){  // riavvia l'animazione d'entrata
        s.parolaTesto.classList.remove("entra");
        void s.parolaTesto.offsetWidth;
        s.parolaTesto.classList.add("entra");
      }
    }
  }
  tappoSporco = false; fontSporco = false;
}

/* ---------------- finestra esterna ---------------- */

function apriFinestra(){
  const f = window.open("", "schermoQuiz", "width=1280,height=760");
  if(!f){
    mostraAvviso("#avvisoPopup", tr("Il browser ha bloccato la finestra. Consenti i popup per questa pagina e riprova."));
    return;
  }
  finestre.esterna = f;
  $("#avvisoPopup").hidden = true;
  const d = f.document;
  d.open();
  d.write('<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Schermo</title>' +
    '<style>html,body{margin:0;height:100%;overflow:hidden;background:' + cfg.tema.sfondo + '}' +
    'body:fullscreen{cursor:none}' + document.getElementById("stileSchermo").textContent +
    '</style></head><body></body></html>');
  d.close();
  const rif = agganciaSchermo(d.body, d);
  f.addEventListener("resize", () => scala(rif));
  d.addEventListener("keydown", ev => {
    if(ev.code === "KeyF"){ ev.preventDefault(); pienoSchermo(d); return; }
    tastoPremuto(ev);
  });
  f.addEventListener("beforeunload", () => {
    const i = schermi.indexOf(rif);
    if(i >= 0) schermi.splice(i,1);
    finestre.esterna = null;
  });
  dipingi();
}

function pienoSchermo(d){
  if(d.fullscreenElement) d.exitFullscreen();
  else if(d.documentElement.requestFullscreen) d.documentElement.requestFullscreen();
}
function chiudiFinestra(){
  if(finestre.esterna && !finestre.esterna.closed) finestre.esterna.close();
}

/* ---------------- schermo sempre acceso ---------------- */

let lucchetto = null;
async function tieniAcceso(){
  try{
    if("wakeLock" in navigator && !lucchetto){
      lucchetto = await navigator.wakeLock.request("screen");
      lucchetto.addEventListener("release", () => { lucchetto = null; });
    }
  }catch(e){ /* non concesso: nessun danno */ }
}
function lasciaSpegnere(){
  if(lucchetto){ lucchetto.release().catch(()=>{}); lucchetto = null; }
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && live) tieniAcceso();
});

/* ---------------- round ---------------- */

function templateDi(g, sc){
  return sc.template && sc.template !== "eredita" ? sc.template : (g.template || "parole");
}
function finaleDi(g){
  const s = g.finale && g.finale.schermo && g.finale.schermo !== "predefinito"
    ? g.finale.schermo : cfg.finale.schermo;
  return {schermo:s, logo:(g.finale||{}).logo || "", testo:(g.finale||{}).testo || ""};
}
function suonoDi(g){
  const s = g.suono || {};
  const tipo = s.tipo && s.tipo !== "predefinito" ? s.tipo : cfg.suono.tipo;
  const vol = s.volume != null ? s.volume : cfg.suono.volume;
  return {tipo, volume:vol};
}

function avviaRound(gi, ri){
  const g = cfg.giochi[gi];
  const sc = g.round[ri];
  const sq = sc.squadraId ? squadraDi(sc.squadraId) : null;  // "" = round senza squadra
  const ms = Math.max(1, sc.secondi) * 1000;
  live = {
    gi, ri,
    squadraId: sq ? sq.id : "",
    gioco: g.nome,
    squadra: sq ? sq.nome || tr("Squadra") : "",
    colore: sq ? sq.colore : "",
    template: templateDi(g, sc),
    timerRisposta: g.timerRisposta || "continua",
    finale: finaleDi(g),
    suono: suonoDi(g),
    elenco: vociDi(sc.voci),
    indice: -1,
    mostraRisposta: false,
    pausaPerRisposta: false,
    durataMs: ms, restoMs: ms,
    inCorsa: false, iniziato: false,
    mostraTappo: false, mostraFinale: false,
  };
  orologio = Date.now();
  tappoSporco = fontSporco = true;
  tieniAcceso();
  disegnaRegia(); dipingi();
}

function chiudiRound(){
  live = null;
  lasciaSpegnere();
  tappoSporco = fontSporco = true;
  disegnaRegia(); dipingi();
}

function avviaFerma(){
  const r = live; if(!r || r.restoMs <= 0) return;
  if(r.mostraTappo || r.mostraFinale){ r.mostraTappo = false; r.mostraFinale = false; tappoSporco = true; }
  if(!r.iniziato){
    r.iniziato = true;
    r.indice = r.elenco.length ? 0 : -1;
    r.mostraRisposta = false;
  }
  r.inCorsa = !r.inCorsa;
  r.pausaPerRisposta = false;
  orologio = Date.now();
  dipingi(); disegnaRegia();
}

function azzera(){
  const r = live; if(!r) return;
  r.restoMs = r.durataMs;
  r.inCorsa = false;
  r.mostraFinale = false;
  if(r.iniziato) r.mostraTappo = false;
  tappoSporco = true;
  orologio = Date.now();
  dipingi(); disegnaRegia();
}

/* correzione in corsa: non tocca la durata configurata del round */
function correggi(secondi){
  const r = live; if(!r) return;
  r.restoMs = Math.max(0, r.restoMs + secondi * 1000);
  if(r.restoMs > 0 && (r.mostraFinale || (r.mostraTappo && r.iniziato))){
    r.mostraFinale = false; r.mostraTappo = false; tappoSporco = true;
  }
  orologio = Date.now();
  dipingi(); disegnaRegia();
}

function imponiTempo(secondi){
  const r = live; if(!r || secondi == null) return;
  r.restoMs = Math.max(0, secondi * 1000);
  if(r.restoMs > 0){ r.mostraFinale = false; if(r.iniziato) r.mostraTappo = false; tappoSporco = true; }
  orologio = Date.now();
  dipingi(); disegnaRegia();
}

function avanti(){
  const r = live;
  if(!r || !r.iniziato || r.template === "timer" || !r.elenco.length) return;
  const v = r.elenco[r.indice];
  if(r.template === "risposte" && !r.mostraRisposta && v && v.r){
    r.mostraRisposta = true;
    if(r.timerRisposta === "ferma" && r.inCorsa){ r.inCorsa = false; r.pausaPerRisposta = true; }
  } else if(r.indice < r.elenco.length - 1){
    r.indice++;
    r.mostraRisposta = false;
    if(r.pausaPerRisposta){ r.inCorsa = true; r.pausaPerRisposta = false; orologio = Date.now(); }
  } else {
    return;
  }
  dipingi(); disegnaRegia();
}

function indietro(){
  const r = live;
  if(!r || !r.iniziato || r.template === "timer" || !r.elenco.length) return;
  if(r.mostraRisposta){
    r.mostraRisposta = false;
    if(r.pausaPerRisposta){ r.inCorsa = true; r.pausaPerRisposta = false; orologio = Date.now(); }
  } else if(r.indice > 0){
    r.indice--;
    const v = r.elenco[r.indice];
    r.mostraRisposta = r.template === "risposte" && !!(v && v.r);
  }
  dipingi(); disegnaRegia();
}

function vaiA(i){
  const r = live; if(!r || !r.iniziato) return;
  r.indice = i; r.mostraRisposta = false;
  dipingi(); disegnaRegia();
}

function tornaInizio(){
  const r = live; if(!r || !r.iniziato) return;
  r.indice = r.elenco.length ? 0 : -1;
  r.mostraRisposta = false;
  dipingi(); disegnaRegia();
}

function alternaTappo(){
  const r = live; if(!r) return;
  r.mostraTappo = !r.mostraTappo;
  r.mostraFinale = false;
  if(r.mostraTappo) r.inCorsa = false;
  tappoSporco = true;
  dipingi(); disegnaRegia();
}

/* ---------------- scorrere del tempo ---------------- */
/* basato su Date.now(), così resta esatto anche se la scheda viene rallentata */

let orologio = Date.now();

setInterval(() => {
  const ora = Date.now();
  const passato = ora - orologio;
  orologio = ora;
  const r = live;
  if(!r || !r.inCorsa) return;
  r.restoMs -= passato;
  if(r.restoMs <= 0){
    r.restoMs = 0;
    r.inCorsa = false;
    r.pausaPerRisposta = false;
    const f = r.finale.schermo;
    if(f === "tappo"){ r.mostraTappo = true; }
    else if(f === "custom"){ r.mostraFinale = true; }
    tappoSporco = true;
    suona(r.suono.tipo, r.suono.volume);
    lasciaSpegnere();
    disegnaRegia();
  }
  dipingi();
}, 50);

/* ---------------- tasti ---------------- */

let inAscolto = null;

function tastoPremuto(ev){
  const b = ev.target;
  const scrive = b && /^(INPUT|TEXTAREA|SELECT)$/.test(b.tagName);

  if(inAscolto){
    if(ev.code === "Tab") return;
    ev.preventDefault();
    for(const k in cfg.tasti) if(cfg.tasti[k] === ev.code) cfg.tasti[k] = "";
    cfg.tasti[inAscolto] = ev.code;
    inAscolto = null;
    disegnaTasti(); disegnaRegia(); segnaModifica();
    return;
  }
  if(scrive || !live) return;

  const t = cfg.tasti;
  let preso = true;
  switch(ev.code){
    case t.avviaFerma: avviaFerma(); break;
    case t.avanti:     avanti(); break;
    case t.indietro:   indietro(); break;
    case t.reset:      azzera(); break;
    case t.piu:        correggi(5); break;
    case t.meno:       correggi(-5); break;
    case t.inizio:     tornaInizio(); break;
    case t.tappo:      alternaTappo(); break;
    case t.fine:       chiudiRound(); break;
    default: preso = false;
  }
  if(preso) ev.preventDefault();
}
document.addEventListener("keydown", tastoPremuto);

/* ---------------- regia ---------------- */

function disegnaRegia(){
  const r = live;
  const attivo = !!r;

  $("#stato").style.borderLeftColor = attivo && r.colore || (attivo ? "var(--acc)" : "var(--riga)");
  $("#statoChi").textContent = !attivo ? tr("Nessun round attivo")
    : [r.gioco, r.squadra].filter(Boolean).join(" · ");
  $("#statoTempo").textContent = attivo ? mmss(r.restoMs) : "--:--";
  $("#statoTempo").className = "tempo" + (!attivo ? ""
    : r.restoMs/1000 <= cfg.vista.sogliaRossa ? " finito"
    : r.restoMs/1000 <= cfg.vista.sogliaGialla ? " scarso" : "");
  $("#statoNota").textContent = !attivo ? tr("Avvia un round dalla colonna a sinistra")
    : r.mostraFinale ? tr("Schermata di fine")
    : r.mostraTappo ? (r.restoMs <= 0 ? tr("Round finito, schermo sul tappo") : tr("Schermo esterno sul tappo"))
    : !r.iniziato ? tr("In attesa, timer a schermo pieno")
    : r.pausaPerRisposta ? tr("In pausa sulla risposta")
    : r.inCorsa ? tr("In corsa") : tr("In pausa");

  const bottoni = ["cAvvia","cReset","cIndietro","cAvanti","cInizio","cTappo","cFine",
                   "cMeno","cMeno5","cPiu5","cPiu","cEsatto","cImponi"];
  bottoni.forEach(id => { $("#"+id).disabled = !attivo; });

  const et = (id, f, t) => $("#"+id).replaceChildren(t, el("kbd", {textContent:nomeTasto(cfg.tasti[f])}));
  et("cAvvia", "avviaFerma", attivo && r.inCorsa ? tr("Ferma") : tr("Avvia"));
  et("cReset", "reset", tr("Azzera"));
  et("cIndietro", "indietro", tr("Indietro"));
  et("cAvanti", "avanti", tr("Avanti"));
  et("cInizio", "inizio", tr("Inizio"));
  et("cTappo", "tappo", tr("Tappo"));
  et("cFine", "fine", tr("Chiudi round"));

  const solo = attivo && r.template === "timer";
  ["cIndietro","cAvanti","cInizio"].forEach(id => { if(solo) $("#"+id).disabled = true; });

  const v = attivo && r.indice >= 0 ? r.elenco[r.indice] : null;
  $("#ora").textContent = !attivo ? "—"
    : solo ? tr("Round solo timer")
    : !r.iniziato ? tr("Premi %s per partire", nomeTasto(cfg.tasti.avviaFerma).toLowerCase())
    : !v ? tr("Scaletta vuota")
    : r.mostraRisposta ? (v.r || v.d)
    : v.d;
  $("#poi").textContent = !attivo || solo || !r.iniziato ? ""
    : r.mostraRisposta ? tr("risposta a schermo")
    : v && v.r ? tr("risposta") + ": " + v.r
    : r.elenco[r.indice+1] ? tr("poi") + ": " + r.elenco[r.indice+1].d
    : v ? tr("ultima voce") : "";

  const ol = $("#voci");
  ol.innerHTML = "";
  if(attivo && !solo){
    r.elenco.forEach((x, i) => {
      const li = document.createElement("li");
      li.className = i === r.indice ? "viva" : i < r.indice ? "passata" : "";
      if(i === r.indice) li.style.background = r.colore || "var(--acc)";
      const n = document.createElement("span"); n.className = "n"; n.textContent = i+1;
      const d = document.createElement("span"); d.textContent = x.d;
      li.append(n, d);
      if(x.r){
        const ris = document.createElement("span");
        ris.className = "ris"; ris.textContent = "→ " + x.r;
        li.appendChild(ris);
      }
      li.onclick = () => vaiA(i);
      ol.appendChild(li);
    });
    const viva = ol.querySelector(".viva");
    if(viva) viva.scrollIntoView({block:"nearest"});
  }
}

/* ---------------- mattoncini per i pannelli ---------------- */

function el(tag, props, ...figli){
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  figli.flat().forEach(f => f != null && e.append(f));
  return e;
}

function campo(testoEtichetta, dentro){
  const d = el("div", {className:"campo"});
  if(testoEtichetta) d.append(el("label", {textContent: testoEtichetta}));
  d.append(dentro);
  return d;
}

function inpTesto(valore, segnaposto, alCambio){
  const i = el("input", {type:"text", value: valore || "", placeholder: segnaposto || ""});
  i.oninput = () => alCambio(i.value);
  return i;
}

function inpColore(valore, alCambio){
  const i = el("input", {type:"color", value: valore});
  i.oninput = () => alCambio(i.value);
  return i;
}

function rigaColore(testoEtichetta, valore, alCambio){
  const r = el("div", {className:"riga-squadra"});
  r.append(inpColore(valore, alCambio), el("span", {textContent: testoEtichetta}));
  return r;
}

function cursore(testoEtichetta, valore, min, max, passo, suffisso, alCambio){
  const d = el("div", {className:"campo"});
  d.append(el("label", {textContent: testoEtichetta}));
  const riga = el("div", {className:"cursore"});
  const i = el("input", {type:"range", min, max, step:passo, value:valore});
  const o = el("output", {textContent: valore + suffisso});
  i.oninput = () => { o.textContent = i.value + suffisso; alCambio(+i.value); };
  riga.append(i, o);
  d.append(riga);
  return d;
}

function spunta(testoEtichetta, valore, alCambio){
  const l = el("label", {className:"spunta"});
  const c = el("input", {type:"checkbox", checked: !!valore});
  c.onchange = () => alCambio(c.checked);
  l.append(c, el("span", {textContent: testoEtichetta}));
  return l;
}

function scelta(testoEtichetta, opzioni, valore, alCambio){
  const s = el("select");
  Object.entries(opzioni).forEach(([v, t]) => {
    const o = el("option", {value:v, textContent:t});
    if(v === valore) o.selected = true;
    s.append(o);
  });
  s.onchange = () => alCambio(s.value);
  return campo(testoEtichetta, s);
}

function chiediFile(accetta, alLetto, comeTesto){
  const i = el("input", {type:"file", accept:accetta});
  i.style.display = "none";
  document.body.append(i);
  i.onchange = () => {
    const f = i.files[0];
    if(f){
      const fr = new FileReader();
      fr.onload = () => alLetto(fr.result, f.name);
      comeTesto ? fr.readAsText(f) : fr.readAsDataURL(f);
    }
    i.remove();
  };
  i.click();
}

function bottoncino(t, titolo, fn, spento){
  const b = el("button", {textContent:t, title:titolo, disabled:!!spento});
  b.onclick = e => { e.stopPropagation(); fn(); };
  return b;
}

function blocco(o){
  const d = el("div", {className:"pieghevole" + (o.aperto ? " aperto" : "")});
  if(o.colore) d.style.borderLeft = "4px solid " + o.colore;
  const t = el("div", {className:"testata"});
  t.append(el("span", {className:"freccia", textContent:"▶"}),
           el("span", {className:"titolo-b", textContent:o.titolo}));
  if(o.pallini){
    const w = el("div");
    w.style.cssText = "display:flex;gap:4px;flex:none";
    o.pallini.forEach(c => {
      const p = el("span", {className:"pallino"});
      p.style.background = c;
      w.append(p);
    });
    t.append(w);
  }
  t.append(el("span", {className:"sommario", textContent:o.sommario || ""}));
  (o.azioni || []).forEach(b => t.append(b));
  t.onclick = o.apri;
  d.append(t);
  if(o.aperto) d.append(el("div", {className:"corpo"}, o.corpo()));
  return d;
}

function aggiorna(){ tappoSporco = true; dipingi(); segnaModifica(); }

/* ---------------- pannello aspetto ---------------- */

/* ↺ accanto a un'impostazione: la riporta all'ultimo salvataggio, o all'originale se non si è mai salvato */
function ripristinabile(elemento, obj, chiavi, rif){
  chiavi = [].concat(chiavi);
  const uguale = () => chiavi.every(k => JSON.stringify(obj[k]) === JSON.stringify(rif[k]));
  const b = el("button", {className:"ripristina", textContent:"↺",
    title: salvata ? tr("Torna all'ultimo salvataggio") : tr("Torna all'originale")});
  b.hidden = uguale();
  b.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    chiavi.forEach(k => { obj[k] = structuredClone(rif[k]); });
    suoniValidi(); cambioTema();
  };
  const d = el("div", {className:"ripr"}, elemento, b);
  d.addEventListener("input", () => { b.hidden = uguale(); });
  d.addEventListener("change", () => { b.hidden = uguale(); });
  return d;
}

function cambioTema(){
  tappoSporco = fontSporco = true;
  riadattaTutti(); segnaModifica(); disegnaTema(); disegnaGiochi();
}

function disegnaTema(){
  const gm = giocoInModifica();
  if(!gm) temaInModifica = null;
  const t = gm ? gm.tema : cfg.tema;
  const box = $("#temaBlocco");
  box.innerHTML = "";
  const p = [];

  const R = salvata || configBase();
  const sg = gm && salvata && salvata.giochi.find(x => x.id === gm.id);
  const rt = sg && sg.tema ? sg.tema : R.tema;
  const T = (e, k) => ripristinabile(e, t, k, rt);
  const F = (e, k) => ripristinabile(e, t.font, k, rt.font);
  const G = (sez, e, k) => ripristinabile(e, cfg[sez], k, R[sez]);

  const sezioni = ["tappo", "angolo", "vista", "finale", "suono", "suoniUtente"];
  const diverso = JSON.stringify(t) !== JSON.stringify(rt) ||
    (!gm && sezioni.some(k => JSON.stringify(cfg[k]) !== JSON.stringify(R[k])));
  if(diverso){
    const riga = el("div", {className:"bottoni rigaTema"});
    riga.append(el("span", {className:"nota", textContent: salvata
        ? tr("Ci sono modifiche non ancora salvate.") : tr("Hai cambiato l'aspetto originale.")}),
      el("button", {textContent: salvata ? tr("Torna all'ultimo salvataggio") : tr("Torna all'originale"), onclick: () => {
        if(gm) gm.tema = structuredClone(rt);
        else {
          cfg.tema = structuredClone(rt);
          sezioni.forEach(k => { cfg[k] = structuredClone(R[k]); });
        }
        suoniValidi(); cambioTema();
      }}));
    p.push(riga);
  }

  if(cfg.giochi.length > 1){
    const opz = {"": tr("Tutti i giochi (tema generale)")};
    cfg.giochi.forEach(g => {
      opz[g.id] = (g.nome || tr("Senza nome")) + (g.tema ? "" : " · " + tr("usa il generale"));
    });
    p.push(el("h2", {textContent:tr("TEMA PER")}));
    p.push(scelta("", opz, gm ? gm.id : "", v => { temaInModifica = v || null; cambioTema(); }));
    if(gm){
      const b = el("div", {className:"bottoni"});
      if(!gm.tema) b.append(el("button", {className:"forte", textContent:tr("Crea un tema per questo gioco"),
        onclick: () => { gm.tema = structuredClone(cfg.tema); cambioTema(); }}));
      else b.append(el("button", {className:"quieto", textContent:tr("Torna al tema generale"),
        onclick: () => { delete gm.tema; cambioTema(); }}));
      p.push(b);
      const altri = cfg.giochi.filter(x => x !== gm && x.tema);
      if(altri.length){
        const da = {"": "—"};
        altri.forEach(x => { da[x.id] = x.nome || tr("Senza nome"); });
        p.push(scelta(tr("Copia il tema da un altro gioco"), da, "", v => {
          if(v){ gm.tema = structuredClone(altri.find(x => x.id === v).tema); cambioTema(); }
        }));
      }
      if(!gm.tema){
        p.push(el("p", {className:"nota", textContent:tr("Questo gioco usa il tema generale.")}));
        box.append(...inSchede(p));
        return;
      }
    }
  }

  p.push(el("h2", {textContent:tr("TEMI PRONTI")}));
  const griglia = el("div", {className:"temi"});
  for(const {nome, ...valori} of Object.values(TEMI)){
    const mini = el("span", {className:"mini" + (valori.onde ? "" : " piatto"), textContent:"Aa"});
    mini.style.cssText = `background:${valori.sfondo};color:${valori.testo};` +
      `--a:${valori.ondeColori[0]};--b:${valori.ondeColori[1]}`;
    griglia.append(el("button", {onclick: () => { Object.assign(t, structuredClone(valori)); aggiorna(); disegnaTema(); }},
      mini, el("span", {className:"nome", textContent:tr(nome)})));
  }
  p.push(griglia);
  p.push(el("p", {className:"nota", textContent:tr("Cambia colori e decorazioni. Poi puoi ritoccare tutto qui sotto.")}));

  p.push(el("h2", {textContent:tr("COLORI")}));
  p.push(T(rigaColore(tr("Sfondo"), t.sfondo, v => { t.sfondo = v; aggiorna(); }), "sfondo"));
  p.push(T(rigaColore(tr("Testo"), t.testo, v => { t.testo = v; aggiorna(); }), "testo"));
  p.push(T(rigaColore(tr("Timer sotto soglia"), t.giallo, v => { t.giallo = v; aggiorna(); }), "giallo"));
  p.push(T(rigaColore(tr("Timer agli ultimi secondi"), t.rosso, v => { t.rosso = v; aggiorna(); }), "rosso"));

  const spuntaRisposta = spunta(tr("Risposta nel colore della squadra"), !t.risposta,
    v => { t.risposta = v ? "" : t.ondeColori[1]; aggiorna(); disegnaTema(); });
  p.push(t.risposta ? spuntaRisposta : T(spuntaRisposta, "risposta"));
  if(t.risposta) p.push(T(rigaColore(tr("Colore della risposta"), t.risposta, v => { t.risposta = v; aggiorna(); }), "risposta"));

  const c = contrasto(t.sfondo, t.testo);
  if(c < 4.5){
    p.push(el("p", {className:"avviso",
      textContent: tr("Sfondo e testo hanno poco contrasto (%s:1). Da lontano si legge male.", c.toFixed(1))}));
  }

  p.push(el("h2", {textContent:tr("DECORAZIONI")}));
  p.push(T(spunta(tr("Onde colorate sopra e sotto"), t.onde, v => { t.onde = v; aggiorna(); disegnaTema(); }), "onde"));
  if(t.onde){
    const g = el("div", {className:"duo3"});
    t.ondeColori.forEach((col, i) => g.append(inpColore(col, v => { t.ondeColori[i] = v; aggiorna(); })));
    p.push(T(campo(tr("Colori delle onde, da sinistra a destra"), g), "ondeColori"));
    p.push(T(cursore(tr("Altezza delle onde"), t.altezzaOnde, 60, 260, 5, " px",
      v => { t.altezzaOnde = v; aggiorna(); }), "altezzaOnde"));

  p.push(T(spunta(tr("Granelli negli angoli"), t.granelli, v => { t.granelli = v; aggiorna(); }), "granelli"));
  p.push(T(spunta(tr("Barra del tempo sul bordo"), t.barra, v => { t.barra = v; aggiorna(); }), "barra"));

  p.push(el("h2", {textContent:tr("IMMAGINE DI SFONDO")}));

  p.push(T(bi, "immagine"));
  if(t.immagine){
    p.push(T(cursore(tr("Velo del colore di sfondo sopra l'immagine"), t.velo, 0, 90, 5, " %",

  } else {

  }

  p.push(el("h2", {textContent:tr("CARATTERE")}));
  const b = el("div", {className:"bottoni"});
  b.append(el("button", {textContent:tr("Carica un font…"), onclick: () =>

      t.font.dati = dati; t.font.nome = nome;
      fontSporco = true; riadattaTutti(); segnaModifica(); disegnaTema();

  if(t.font.dati){
    b.append(el("button", {className:"quieto", textContent:tr("Torna al carattere base"), onclick: () => {
      t.font.dati = ""; t.font.nome = "";
      fontSporco = true; riadattaTutti(); segnaModifica(); disegnaTema();
    }}));
  }
  p.push(F(b, ["dati", "nome"]));
  if(t.font.nome) p.push(el("p", {className:"nota", textContent: tr("In uso: %s", t.font.nome)}));
  p.push(F(cursore(tr("Dimensione massima delle parole"), t.font.scala, 40, 160, 5, " %",
    v => { t.font.scala = v; riadattaTutti(); segnaModifica(); }), "scala"));
  p.push(F(cursore(tr("Spessore"), t.font.peso, 100, 900, 100, "",
    v => { t.font.peso = v; riadattaTutti(); segnaModifica(); }), "peso"));
  p.push(F(cursore(tr("Spaziatura tra le lettere"), t.font.spaziatura, -5, 20, 1, "",
    v => { t.font.spaziatura = v; riadattaTutti(); segnaModifica(); }), "spaziatura"));
  p.push(F(spunta(tr("Corsivo"), t.font.corsivo, v => { t.font.corsivo = v; riadattaTutti(); segnaModifica(); }), "corsivo"));
  p.push(F(spunta(tr("Tutto maiuscolo"), t.font.maiuscolo, v => { t.font.maiuscolo = v; riadattaTutti(); segnaModifica(); }), "maiuscolo"));

  p.push(el("h2", {textContent:tr("TRANSIZIONE TRA LE PAROLE")}));
  p.push(T(scelta("", tOpz(TRANSIZIONI), t.transizione, v => { t.transizione = v; dipingi(); segnaModifica(); }), "transizione"));

  if(gm){
    p.push(el("p", {className:"nota", textContent:tr("Tappo, loghi, timer e suono valgono per tutti i giochi.")}));
    box.append(...inSchede(p));
    return;
  }

  p.push(el("h2", {textContent:tr("TAPPO")}));
  const bt = el("div", {className:"bottoni"});
  bt.append(el("button", {textContent:tr("Carica il logo…"), onclick: () =>
    chiediFile("image/*", dati => { cfg.tappo.logo = dati; cfg.tappo.mostraLogo = true; aggiorna(); disegnaTema(); })}));
  bt.append(el("button", {className:"quieto", textContent:tr("Rimetti il logo SAM"), onclick: () => {
    cfg.tappo.logo = LOGO_SAM; aggiorna(); disegnaTema();
  }}));
  bt.append(el("button", {className:"quieto", textContent:tr("Togli il logo"), onclick: () => {
    cfg.tappo.logo = LOGO_SEGNAPOSTO; aggiorna(); disegnaTema();
  }}));
  p.push(G("tappo", bt, "logo"));
  p.push(G("tappo", spunta(tr("Mostra il logo sul tappo"), cfg.tappo.mostraLogo,
    v => { cfg.tappo.mostraLogo = v; aggiorna(); }), "mostraLogo"));
  p.push(G("tappo", cursore(tr("Dimensione del logo"), cfg.tappo.scalaLogo, 30, 220, 5, " %",
    v => { cfg.tappo.scalaLogo = v; aggiorna(); }), "scalaLogo"));
  p.push(G("tappo", campo(tr("Scritta sul tappo"), inpTesto(cfg.tappo.testo, tr("es. Torniamo tra poco"),
    v => { cfg.tappo.testo = v; aggiorna(); })), "testo"));
  p.push(G("tappo", cursore(tr("Dimensione della scritta"), cfg.tappo.scalaTesto, 40, 200, 5, " %",
    v => { cfg.tappo.scalaTesto = v; aggiorna(); }), "scalaTesto"));

  p.push(el("h2", {textContent:tr("LOGO NELL'ANGOLO")}));
  const ba = el("div", {className:"bottoni"});
  ba.append(el("button", {textContent:tr("Carica…"), onclick: () =>
    chiediFile("image/*", dati => { cfg.angolo.logo = dati; aggiorna(); })}));
  ba.append(el("button", {className:"quieto", textContent:tr("Usa lo stesso del tappo"), onclick: () => {
    cfg.angolo.logo = cfg.tappo.logo; aggiorna();
  }}));
  p.push(G("angolo", ba, "logo"));
  p.push(G("angolo", spunta(tr("Mostra il logo sulle slide"), cfg.angolo.mostra, v => { cfg.angolo.mostra = v; aggiorna(); }), "mostra"));
  p.push(G("angolo", scelta(tr("Posizione"), {
    "alto-destra":tr("In alto a destra"), "alto-sinistra":tr("In alto a sinistra"),
    "basso-destra":tr("In basso a destra"), "basso-sinistra":tr("In basso a sinistra"),
  }, cfg.angolo.posizione, v => { cfg.angolo.posizione = v; aggiorna(); }), "posizione"));
  p.push(G("angolo", cursore(tr("Dimensione"), cfg.angolo.scala, 40, 260, 5, " %", v => { cfg.angolo.scala = v; aggiorna(); }), "scala"));

  p.push(el("h2", {textContent:tr("NOME DELLA SQUADRA")}));
  p.push(G("vista", scelta(tr("Posizione prima che parta il round"), {
    sinistra:tr("A sinistra"), centro:tr("Al centro"), destra:tr("A destra"),
  }, cfg.vista.targa, v => { cfg.vista.targa = v; aggiorna(); }), "targa"));

  p.push(el("h2", {textContent:tr("TIMER")}));
  p.push(G("vista", scelta(tr("Posizione sulle slide con le parole"), {
    "basso-destra":tr("In basso a destra"), "basso-sinistra":tr("In basso a sinistra"),
    "alto-destra":tr("In alto a destra"), "centro-basso":tr("In basso al centro"),
  }, cfg.vista.timerPosizione, v => { cfg.vista.timerPosizione = v; aggiorna(); }), "timerPosizione"));
  p.push(G("vista", cursore(tr("Dimensione"), cfg.vista.timerScala, 50, 180, 5, " %",
    v => { cfg.vista.timerScala = v; aggiorna(); }), "timerScala"));
  p.push(G("vista", cursore(tr("Cambia colore sotto i"), cfg.vista.sogliaGialla, 3, 60, 1, " s",
    v => { cfg.vista.sogliaGialla = v; aggiorna(); }), "sogliaGialla"));
  p.push(G("vista", cursore(tr("Ultimi secondi sotto i"), cfg.vista.sogliaRossa, 1, 30, 1, " s",
    v => { cfg.vista.sogliaRossa = v; aggiorna(); }), "sogliaRossa"));

  p.push(el("h2", {textContent:tr("FINE ROUND, PER TUTTI I GIOCHI")}));
  p.push(G("finale", scelta(tr("Lo schermo esterno"), {tappo:tr("Torna al tappo"), resta:tr("Resta sull'ultima schermata")},
    cfg.finale.schermo, v => { cfg.finale.schermo = v; segnaModifica(); }), "schermo"));
  p.push(G("suono", scelta(tr("Suono"), opzioniSuoni(),
    cfg.suono.tipo, v => { cfg.suono.tipo = v; suona(v, cfg.suono.volume); segnaModifica(); }), "tipo"));
  p.push(G("suono", cursore(tr("Volume"), cfg.suono.volume, 0, 100, 5, " %",
    v => { cfg.suono.volume = v; segnaModifica(); }), "volume"));

  p.push(el("h2", {textContent:tr("I TUOI SUONI")}));
  cfg.suoniUtente.forEach((s, i) => {
    const riga = el("div", {className:"riga-squadra"});
    const nome = inpTesto(s.nome, tr("Nome del suono"), v => { s.nome = v; segnaModifica(); });
    nome.onblur = () => { disegnaTema(); disegnaGiochi(); };
    riga.append(
      el("button", {className:"quieto", textContent:"▶", title:tr("Ascolta"), onclick: () => suona(s.id, cfg.suono.volume)}),
      nome,
      el("span", {className:"nota", textContent: Math.round(s.dati.length * .75 / 1024) + " KB"}),
      el("button", {className:"quieto", textContent:"✕", title:tr("Elimina"), onclick: () => {
        cfg.suoniUtente.splice(i, 1); suoniValidi();
        disegnaTema(); disegnaGiochi(); segnaModifica();
      }}));
    p.push(riga);
  });
  p.push(el("div", {className:"bottoni"}, el("button", {textContent:tr("Aggiungi un suono…"), onclick: () =>
    chiediFile("audio/*", (dati, nomeFile) => {
      if(!dati.startsWith("data:audio/")){
        mostraAvviso("#avvisoPopup", tr("Quel file non è un audio.")); return;
      }
      if(dati.length > 5e6 * 4 / 3){
        mostraAvviso("#avvisoPopup", tr("Il suono è troppo grande: tienilo sotto i 5 MB.")); return;
      }
      const id = nuovoId();
      cfg.suoniUtente.push({id, nome: nomeFile.replace(/\.[^.]+$/, ""), dati});
      cfg.suono.tipo = id;
      suona(id, cfg.suono.volume);
      disegnaTema(); disegnaGiochi(); segnaModifica();
    })})));
  p.push(el("p", {className:"nota", textContent:tr("Mp3, wav, ogg… Tienili brevi: finiscono dentro il file salvato. Poi li scegli qui sopra o nel singolo gioco.")}));
  box.append(...inSchede(p));
}

/* spezza una lista di elementi in schede, una per ogni titolo h2 */
function inSchede(lista){
  const schede = [];
  lista.forEach(e => {
    if(e.tagName === "H2" || !schede.length) schede.push(el("section", {className:"scheda"}));
    schede[schede.length-1].append(e);
  });
  return schede;
}

/* ---------------- squadre ---------------- */

function disegnaRubrica(){
  const box = $("#rubricaBlocco");
  box.innerHTML = "";
  const p = [];
  cfg.rubrica.forEach((sq, i) => {
    const d = el("div");
    const riga = el("div", {className:"riga-squadra"});
    const col = inpColore(sq.colore, v => { sq.colore = v; coloreCambiato(sq); });
    const nome = inpTesto(sq.nome, tr("Nome squadra"), v => {
      sq.nome = v;
      if(live && live.squadraId === sq.id){ live.squadra = v; tappoSporco = true; dipingi(); disegnaRegia(); }
      segnaModifica();
    });
    nome.onblur = () => { disegnaGiochi(); disegnaRubrica(); };
    const via = el("button", {className:"quieto", textContent:"✕", title:tr("Elimina")});
    via.onclick = () => {
      if(cfg.rubrica.length <= 1) return;
      cfg.rubrica.splice(i,1);
      cfg.giochi.forEach(g => g.round.forEach(x => {
        if(!squadraDi(x.squadraId) || x.squadraId === sq.id) x.squadraId = cfg.rubrica[0].id;
      }));
      disegnaRubrica(); disegnaGiochi(); segnaModifica();
    };
    riga.append(col, nome, via);
    const tav = el("div", {className:"tavolozza"});
    COLORI.forEach(c => {
      const b = el("button", {title:c});
      b.style.background = c;
      b.onclick = () => { sq.colore = c; col.value = c; coloreCambiato(sq); };
      tav.append(b);
    });
    d.append(riga, tav);
    p.push(d);
  });
  const b = el("div", {className:"bottoni"});
  b.style.marginTop = "12px";
  b.append(el("button", {textContent:tr("Aggiungi squadra"), onclick: () => {
    cfg.rubrica.push({id:nuovoId(), nome:tr("Squadra %s", cfg.rubrica.length+1),
                      colore:COLORI[cfg.rubrica.length % COLORI.length]});
    disegnaRubrica(); disegnaGiochi(); segnaModifica();
  }}));
  p.push(b);
  box.append(el("section", {className:"scheda"}, p));
}

function coloreCambiato(sq){
  if(live && live.squadraId === sq.id){ live.colore = sq.colore; dipingi(); disegnaRegia(); }
  disegnaRubrica(); disegnaGiochi(); segnaModifica();
}

/* ---------------- giochi e round ---------------- */

function sposta(lista, i, d){
  const j = i + d;
  if(j < 0 || j >= lista.length) return;
  [lista[i], lista[j]] = [lista[j], lista[i]];
  disegnaGiochi(); segnaModifica();
}

function disegnaGiochi(){
  const box = $("#giochi");
  box.innerHTML = "";
  cfg.giochi.forEach((g, gi) => {
    box.append(blocco({
      titolo: g.nome || tr("Senza nome"),
      sommario: tr("%s round", g.round.length) + " · " + tr(TEMPLATE[g.template || "parole"]).toLowerCase(),
      aperto: g.aperto,
      apri: () => { g.aperto = !g.aperto; disegnaGiochi(); },
      azioni: [
        bottoncino("↑", tr("Sposta su"),  () => sposta(cfg.giochi, gi, -1), gi === 0),
        bottoncino("↓", tr("Sposta giù"), () => sposta(cfg.giochi, gi, 1),  gi === cfg.giochi.length-1),
        bottoncino("✕", tr("Elimina il gioco"), () => {
          if(cfg.giochi.length <= 1) return;
          cfg.giochi.splice(gi,1); disegnaGiochi(); cambioTema();
        }),
      ],
      corpo: () => {
        const p = [];
        const nome = inpTesto(g.nome, tr("es. Indovina la parola"), v => {
          g.nome = v;
          if(live && live.gi === gi){ live.gioco = v; disegnaRegia(); }
          segnaModifica();
        });
        nome.onblur = () => { disegnaGiochi(); disegnaTema(); };
        p.push(campo(tr("Nome del gioco"), nome));

        p.push(scelta(tr("Template predefinito dei round"), tOpz(TEMPLATE), g.template || "parole",
          v => { g.template = v; disegnaGiochi(); segnaModifica(); }));

        if((g.template || "parole") === "risposte" ||
           g.round.some(x => x.template === "risposte")){
          p.push(scelta(tr("Mentre è a schermo la risposta, il tempo"),
            {continua:tr("Continua a scorrere"), ferma:tr("Si ferma finché non vado avanti")},
            g.timerRisposta || "continua", v => { g.timerRisposta = v; segnaModifica(); }));
        }

        g.finale = g.finale || {schermo:"predefinito", logo:"", testo:""};
        p.push(scelta(tr("A tempo scaduto lo schermo esterno"), {
          predefinito:tr("Come gli altri giochi"), tappo:tr("Torna al tappo"),
          resta:tr("Resta sull'ultima schermata"), custom:tr("Mostra una schermata sua"),
        }, g.finale.schermo, v => { g.finale.schermo = v; disegnaGiochi(); segnaModifica(); }));

        if(g.finale.schermo === "custom"){
          const b = el("div", {className:"bottoni"});
          b.append(el("button", {textContent:tr("Immagine di fine…"), onclick: () =>
            chiediFile("image/*", dati => { g.finale.logo = dati; aggiorna(); })}));
          if(g.finale.logo) b.append(el("button", {className:"quieto", textContent:tr("Togli"), onclick: () => {
            g.finale.logo = ""; aggiorna(); disegnaGiochi();
          }}));
          p.push(b);
          p.push(campo(tr("Scritta di fine"), inpTesto(g.finale.testo, tr("es. Tempo scaduto"),
            v => { g.finale.testo = v; aggiorna(); })));
        }

        g.suono = g.suono || {tipo:"predefinito"};
        p.push(scelta(tr("Suono di fine"), Object.assign({predefinito:tr("Come gli altri giochi")}, opzioniSuoni()),
          g.suono.tipo, v => {
          g.suono.tipo = v;
          if(v !== "predefinito" && v !== "nessuno") suona(v, cfg.suono.volume);
          segnaModifica();
        }));

        if(cfg.giochi.length > 1){
          const rt = el("div", {className:"bottoni rigaTema"});
          rt.append(el("span", {className:"nota", textContent: g.tema
              ? tr("Questo gioco ha un tema suo.") : tr("Questo gioco usa il tema generale.")}),
            el("button", {textContent:tr("Modifica l'aspetto"), onclick: () => {
              temaInModifica = g.id; mostraPannello("pAspetto"); disegnaTema();
            }}));
          p.push(rt);
        }

        const gruppo = el("div", {className:"gruppo"});
        gruppo.style.marginTop = "12px";
        g.round.forEach((sc, ri) => gruppo.append(schedaRound(g, gi, sc, ri)));
        p.push(gruppo);

        const b = el("div", {className:"bottoni"});
        b.append(el("button", {textContent:tr("Aggiungi round"), onclick: () => {
          g.round.push({squadraId:cfg.rubrica[0].id, secondi:90, voci:"", template:"eredita", aperto:true});
          disegnaGiochi(); segnaModifica();
        }}));
        p.push(b);
        return p;
      },
    }));
  });
}

function schedaRound(g, gi, sc, ri){
  const sq = sc.squadraId ? squadraDi(sc.squadraId) : null;
  const tpl = templateDi(g, sc);
  const n = vociDi(sc.voci).length;
  const riassunto = scriviTempo(sc.secondi) + " · " +
    (tpl === "timer" ? tr("solo timer") : tr(n === 1 ? "%s voce" : "%s voci", n));

  return blocco({
    titolo: sq ? sq.nome : tr("Nessuna squadra"),
    colore: sq ? sq.colore : "transparent",
    sommario: riassunto,
    aperto: sc.aperto,
    apri: () => { sc.aperto = !sc.aperto; disegnaGiochi(); },
    azioni: [
      Object.assign(bottoncino("▶", tr("Avvia questo round"), () => avviaRound(gi, ri)), {className:"gioca"}),
      bottoncino("↑", tr("Sposta su"),  () => sposta(g.round, ri, -1), ri === 0),
      bottoncino("↓", tr("Sposta giù"), () => sposta(g.round, ri, 1),  ri === g.round.length-1),
      bottoncino("✕", tr("Elimina il round"), () => { g.round.splice(ri,1); disegnaGiochi(); segnaModifica(); }),
    ],
    corpo: () => {
      const p = [];
      const duo = el("div", {className:"duo"});
      const s = el("select");
      s.append(el("option", {value:"", textContent:tr("Nessuna squadra (colori del tema)"), selected:!sc.squadraId}));
      cfg.rubrica.forEach(x => {
        const o = el("option", {value:x.id, textContent:x.nome || tr("Senza nome")});
        if(x.id === sc.squadraId) o.selected = true;
        s.append(o);
      });
      s.onchange = () => { sc.squadraId = s.value; disegnaGiochi(); segnaModifica(); };

      /* tempo libero: qualunque valore, in secondi o in mm:ss, validato all'uscita */
      const t = el("input", {type:"text", value:scriviTempo(sc.secondi), placeholder:"1:30"});
      t.onblur = () => {
        const v = leggiTempo(t.value);
        sc.secondi = v && v > 0 ? v : sc.secondi;
        t.value = scriviTempo(sc.secondi);
        disegnaGiochi(); segnaModifica();
      };
      t.onkeydown = e => { if(e.key === "Enter") t.blur(); };

      duo.append(campo(tr("Squadra"), s), campo(tr("Durata"), t));
      p.push(duo);

      p.push(scelta(tr("Template"), Object.assign(
        {eredita: tr("Come il gioco (%s)", tr(TEMPLATE[g.template || "parole"]).toLowerCase())}, tOpz(TEMPLATE)),
        sc.template || "eredita", v => { sc.template = v; disegnaGiochi(); segnaModifica(); }));

      if(tpl !== "timer"){
        const voci = el("textarea", {value: sc.voci});
        voci.oninput = () => { sc.voci = voci.value; segnaModifica(); };
        voci.onblur = () => disegnaGiochi();
        p.push(campo(tpl === "risposte"
          ? tr("Una per riga, con la risposta dopo la barra: domanda | risposta")
          : tr("Voci del round, una per riga"), voci));
      }

      const b = el("div", {className:"bottoni"});
      b.style.marginTop = "10px";
      b.append(el("button", {className:"forte", textContent:tr("Avvia round"), onclick: () => avviaRound(gi, ri)}));
      b.append(el("button", {textContent:tr("Duplica"), onclick: () => {
        g.round.splice(ri+1, 0, JSON.parse(JSON.stringify(sc)));
        disegnaGiochi(); segnaModifica();
      }}));
      p.push(b);
      return p;
    },
  });
}

/* ---------------- tasti ---------------- */

function disegnaTasti(){
  const box = $("#tastiBlocco");
  box.innerHTML = "";
  const t = el("table", {className:"tasti"});
  for(const [chiave, etichetta] of FUNZIONI){
    const riga = el("tr");
    const td2 = el("td");
    td2.style.textAlign = "right";
    const b = el("button", {className:"quieto"});
    const k = el("kbd");
    if(inAscolto === chiave){ k.className = "ascolto"; k.textContent = tr("premi…"); }
    else k.textContent = nomeTasto(cfg.tasti[chiave]);
    b.append(k);
    b.onclick = () => { inAscolto = inAscolto === chiave ? null : chiave; disegnaTasti(); };
    td2.append(b);
    riga.append(el("td", {textContent: tr(etichetta)}), td2);
    t.append(riga);
  }
  box.append(el("section", {className:"scheda"}, t, el("p", {className:"nota",
    textContent:tr("Attivi solo a round avviato, sia da qui che dalla finestra esterna. Clicca un tasto per rimapparlo.")})));
}

/* ---------------- salvataggio dentro il file stesso ---------------- */

const CHIAVE = "regia-quiz";
let manico = null;
let rimando = null;

function mostraAvviso(sel, testo, bottoni){
  const a = $(sel);
  a.innerHTML = "";
  a.hidden = false;
  a.append(el("div", {textContent:testo}));
  (bottoni || []).forEach(b => a.append(b));
}

function nota(testo){ $("#notaSalva").textContent = testo; }

function segnaModifica(){
  clearTimeout(rimando);
  rimando = setTimeout(() => {
    cfg.salvatoIl = Date.now();
    try{ localStorage.setItem(CHIAVE, JSON.stringify(cfg)); }catch(e){}
    nota(tr("Modifiche non ancora scritte nel file. Premi Salva."));
  }, 400);
}

function generaHTML(){
  const clone = document.documentElement.cloneNode(true);
  ["temaBlocco","rubricaBlocco","giochi","tastiBlocco","anteprima","voci"].forEach(id => {
    const e = clone.querySelector("#" + id);
    if(e) e.innerHTML = "";
  });
  clone.querySelectorAll(".avviso").forEach(e => { e.innerHTML = ""; e.setAttribute("hidden",""); });
  clone.querySelectorAll("details").forEach(d => d.removeAttribute("open"));
  const f = clone.querySelector("#fontUtente");
  if(f) f.remove();
  const o = clone.querySelector("#ora"); if(o) o.textContent = "—";
  const q = clone.querySelector("#poi"); if(q) q.textContent = "";
  const ns = clone.querySelector("#notaSalva"); if(ns) ns.textContent = "";
  cfg.salvatoIl = Date.now();
  const dati = JSON.stringify(cfg).replace(/</g, "\\u003c");
  clone.querySelector("#configurazione").textContent = dati;
  return "<!doctype html>\n" + clone.outerHTML;
}

function scarica(testo, nomeFile){
  const a = el("a", {href: URL.createObjectURL(new Blob([testo], {type:"text/html"})),
                     download: nomeFile || "regia-quiz.html"});
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function salva(){
  const testo = generaHTML();
  try{ localStorage.setItem(CHIAVE, JSON.stringify(cfg)); }catch(e){}
  if(window.showSaveFilePicker){
    try{
      if(!manico){
        manico = await window.showSaveFilePicker({
          suggestedName: "regia-quiz.html",
          types: [{description:tr("Pagina HTML"), accept:{"text/html":[".html"]}}],
        });
      }
      const w = await manico.createWritable();
      await w.write(testo);
      await w.close();
      nota(tr("Salvato alle %s.", new Date().toLocaleTimeString(locale())));
      salvata = structuredClone(cfg); disegnaTema();
      return;
    }catch(e){
      if(e && e.name === "AbortError") return;
      manico = null;
    }
  }
  scarica(testo);
  salvata = structuredClone(cfg); disegnaTema();
  nota(tr("Il tuo browser non può riscrivere il file aperto: ne ha scaricato uno nuovo. " +
          "Sostituisci il vecchio con quello appena scaricato."));
}

function importaDaHTML(testo){
  const m = testo.match(/<script[^>]*id="configurazione"[^>]*>([\s\S]*?)<\/script>/);
  if(!m){ mostraAvviso("#avvisoPopup", tr("In quel file non ho trovato nessuna configurazione.")); return; }
  try{
    applicaConfig(JSON.parse(m[1].replace(/\\u003c/g, "<")));
    salvata = structuredClone(cfg); disegnaTema();
    $("#avvisoPopup").hidden = true;
    nota(tr("Configurazione ripresa dal file."));
  }catch(e){
    mostraAvviso("#avvisoPopup", tr("La configurazione in quel file è illeggibile."));
  }
}

function temaCompleto(t){
  const base = configBase().tema;
  return Object.assign(base, t || {}, {font: Object.assign(base.font, (t || {}).font || {})});
}

/* la configurazione salvata sopra quella di base: i campi aggiunti dopo prendono il valore di base */
function unisciConfig(nuovo){
  const base = configBase();
  const c = Object.assign({}, base, nuovo);
  c.tema = temaCompleto(nuovo.tema);
  for(const k of ["tappo", "angolo", "vista", "suono", "finale", "tasti"]) c[k] = Object.assign(base[k], nuovo[k] || {});
  if(!Array.isArray(c.suoniUtente)) c.suoniUtente = [];
  if(!Array.isArray(c.rubrica) || !c.rubrica.length) c.rubrica = base.rubrica;
  if(!Array.isArray(c.giochi) || !c.giochi.length) c.giochi = base.giochi;
  c.giochi.forEach(g => {
    if(!Array.isArray(g.round)) g.round = [];
    if(g.tema) g.tema = temaCompleto(g.tema);
    g.round.forEach(x => {
      if(x.squadraId && !c.rubrica.some(s => s.id === x.squadraId)) x.squadraId = c.rubrica[0].id;
    });
  });
  return c;
}

function applicaConfig(nuovo){
  impostaLingua(nuovo.lingua || linguaAttiva());
  cfg = unisciConfig(nuovo);
  live = null;
  tappoSporco = fontSporco = true;
  cfg.lingua = linguaAttiva();
  $("#selLingua").value = linguaAttiva();
  traduciPagina(); aggiornaLink();
  disegnaTema(); disegnaRubrica(); disegnaGiochi(); disegnaTasti(); disegnaRegia();
  riadattaTutti();
}

/* ---------------- collegamenti ---------------- */

function aggiornaLink(){
  const a = $("#linkIstruzioni");
  if(a) a.href = REPO + "/blob/HEAD/" + (linguaAttiva() === "en" ? "INSTRUCTIONS.md" : "ISTRUZIONI.md");
}

$("#selLingua").onchange = e => {
  impostaLingua(e.target.value);
  traduciPagina();
  aggiornaLink();
  disegnaTema(); disegnaRubrica(); disegnaGiochi(); disegnaTasti(); disegnaRegia();
  tappoSporco = true; dipingi();
  segnaModifica();
};

function mostraPannello(id){
  document.querySelectorAll("[data-pannello]").forEach(b => {
    const on = b.dataset.pannello === id;
    b.setAttribute("aria-selected", on);
    $("#" + b.dataset.pannello).hidden = !on;
  });
  tappoSporco = fontSporco = true;
  riadattaTutti();
}
document.querySelectorAll("[data-pannello]").forEach(b => { b.onclick = () => mostraPannello(b.dataset.pannello); });

/* il menu Altro si chiude dopo una scelta o con un clic fuori */
document.addEventListener("click", e => {
  const m = $(".menu");
  if(!m.contains(e.target) || e.target.closest(".menuTendina")) m.open = false;
});

$("#btnApri").onclick = apriFinestra;
$("#btnChiudi").onclick = chiudiFinestra;
$("#btnNuovoGioco").onclick = () => {
  cfg.giochi.forEach(g => g.aperto = false);
  cfg.giochi.push({
    id:nuovoId(), nome: tr("Gioco %s", cfg.giochi.length + 1), aperto:true,
    template:"parole", timerRisposta:"continua",
    finale:{schermo:"predefinito", logo:"", testo:""}, suono:{tipo:"predefinito"},
    round:[{squadraId:cfg.rubrica[0].id, secondi:90, voci:"", template:"eredita", aperto:false}],
  });
  disegnaGiochi(); disegnaTema(); segnaModifica();
};
$("#btnSalva").onclick = salva;
$("#btnScaricaCopia").onclick = () => { scarica(generaHTML()); nota(tr("Copia scaricata.")); };
$("#btnImporta").onclick = () => chiediFile(".html,text/html", testo => importaDaHTML(testo), true);

$("#cAvvia").onclick    = avviaFerma;
$("#cReset").onclick    = azzera;
$("#cAvanti").onclick   = avanti;
$("#cIndietro").onclick = indietro;
$("#cInizio").onclick   = tornaInizio;
$("#cTappo").onclick    = alternaTappo;
$("#cFine").onclick     = chiudiRound;
$("#cMeno").onclick     = () => correggi(-10);
$("#cMeno5").onclick    = () => correggi(-5);
$("#cPiu5").onclick     = () => correggi(5);
$("#cPiu").onclick      = () => correggi(10);
$("#cImponi").onclick   = () => { imponiTempo(leggiTempo($("#cEsatto").value)); $("#cEsatto").value = ""; };
$("#cEsatto").onkeydown = e => { if(e.key === "Enter") $("#cImponi").click(); };

/* ---------------- avvio ---------------- */

(function partenza(){
  try{
    const dentro = JSON.parse(document.getElementById("configurazione").textContent);
    if(dentro && dentro.versione){
      impostaLingua(dentro.lingua || LINGUA);
      cfg = unisciConfig(dentro);
      if(dentro.salvatoIl) salvata = structuredClone(cfg);
    }
  }catch(e){}
  if(!cfg.lingua) impostaLingua((navigator.language || "it").toLowerCase().startsWith("it") ? "it" : "en");
  $("#selLingua").value = linguaAttiva();
  traduciPagina();
  aggiornaLink();

  mostraPannello("pGiochi");
  agganciaSchermo($("#anteprima"), document);
  disegnaTema(); disegnaRubrica(); disegnaGiochi(); disegnaTasti(); disegnaRegia(); dipingi();
  new ResizeObserver(scalaTutti).observe($("#anteprima"));

  try{
    const salvato = JSON.parse(localStorage.getItem(CHIAVE) || "null");
    if(salvato && salvato.salvatoIl > (cfg.salvatoIl || 0) + 1000){
      const quando = new Date(salvato.salvatoIl).toLocaleString(locale());
      const si = el("button", {className:"forte", textContent:tr("Recupera")});
      si.onclick = () => { applicaConfig(salvato); $("#avvisoRecupero").hidden = true; };
      const no = el("button", {className:"quieto", textContent:tr("Ignora")});
      no.onclick = () => { $("#avvisoRecupero").hidden = true; };
      mostraAvviso("#avvisoRecupero",
        tr("In questo browser c'è una versione più recente, del %s, che non è mai stata scritta nel file.", quando),
        [si, no]);
    }
  }catch(e){}

  if(!window.showSaveFilePicker){
    nota(tr("Su questo browser il pulsante Salva scarica un file nuovo da mettere al posto del vecchio."));
  }
})();
</script>
