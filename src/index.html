<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q.I.Z — timer e parole per giochi dal vivo</title>
<meta name="description" content="Timer e schermate per giochi a squadre dal vivo: regia su un monitor, proiezione sull'altro. Funziona offline, in un file solo.">
<style id="stileRegia">__CSS_REGIA__</style>
<style id="stileSchermo">__CSS_SCHERMO__</style>
</head>
<body>

<header class="barraAlta">
  <div class="marchio">Q.I.Z <span class="versione">__VERSIONE__</span></div>
  <p class="nota" id="notaSalva"></p>
  <button class="forte" id="btnSalva" data-t="Salva">Salva</button>
  <details class="menu">
    <summary data-t="Altro">Altro</summary>
    <div class="menuTendina">
      <button id="btnScaricaCopia" data-t="Scarica una copia">Scarica una copia</button>
      <button id="btnImporta" data-t="Riprendi da un file">Riprendi da un file</button>
      <a id="linkIstruzioni" href="__REPO__" target="_blank" rel="noopener" data-t="Istruzioni passo passo">Istruzioni passo passo</a>
    </div>
  </details>
  <select id="selLingua" title="Lingua / Language">
    <option value="it">Italiano</option>
    <option value="en">English</option>
  </select>
</header>

<div class="colonna" id="colonnaSinistra">
  <h1 data-t="Preparazione">Preparazione</h1>

  <div id="avvisoRecupero" class="avviso" hidden></div>
  <div id="avvisoPopup" class="avviso" hidden></div>

  <nav class="linguette" role="tablist">
    <button role="tab" data-pannello="pGiochi" data-t="Giochi">Giochi</button>
    <button role="tab" data-pannello="pSquadre" data-t="Squadre">Squadre</button>
    <button role="tab" data-pannello="pAspetto" data-t="Aspetto">Aspetto</button>
    <button role="tab" data-pannello="pTasti" data-t="Tasti">Tasti</button>
  </nav>

  <section class="pannello" id="pGiochi" role="tabpanel">
    <div id="giochi"></div>
    <button class="aggiungi" id="btnNuovoGioco" data-t="Aggiungi gioco">Aggiungi gioco</button>
  </section>
  <section class="pannello" id="pSquadre" role="tabpanel" hidden><div id="rubricaBlocco"></div></section>
  <section class="pannello" id="pAspetto" role="tabpanel" hidden><div id="temaBlocco"></div></section>
  <section class="pannello" id="pTasti" role="tabpanel" hidden><div id="tastiBlocco"></div></section>
</div>

<div class="colonna" id="colonnaDestra">
  <div class="testaColonna">
    <h1 data-t="In diretta">In diretta</h1>
    <button id="btnApri" data-t="Apri schermo esterno">Apri schermo esterno</button>
    <button class="quieto" id="btnChiudi" data-t="Chiudi">Chiudi</button>
  </div>
  <p class="nota suggerimento" data-t="Trascina la finestra sul secondo monitor, poi premi F lì dentro per il pieno schermo.">Trascina la finestra sul secondo monitor, poi premi F lì dentro per il pieno schermo.</p>

  <div class="live">
    <div class="stato" id="stato">
      <div>
        <div class="chi" id="statoChi">Nessun round attivo</div>
        <div class="nota" id="statoNota">Avvia un round dalla colonna a sinistra</div>
      </div>
      <div class="tempo" id="statoTempo">--:--</div>
    </div>
    <div class="comandi">
      <button class="forte" id="cAvvia" disabled>Avvia</button>
      <button id="cIndietro" disabled>Indietro</button>
      <button id="cAvanti" disabled>Avanti</button>
      <button id="cInizio" disabled>Inizio</button>
      <button id="cTappo" disabled>Tappo</button>
      <button id="cReset" disabled>Azzera</button>
      <button id="cFine" disabled>Chiudi round</button>
    </div>
    <div class="correggi">
      <span data-t="Correggi il tempo">Correggi il tempo</span>
      <button id="cMeno" disabled>−10</button>
      <button id="cMeno5" disabled>−5</button>
      <button id="cPiu5" disabled>+5</button>
      <button id="cPiu" disabled>+10</button>
      <input type="text" id="cEsatto" placeholder="1:30" disabled>
      <button id="cImponi" data-t="Imposta" disabled>Imposta</button>
    </div>
  </div>

  <div class="palco">
    <div class="anteprima" id="anteprima"></div>
    <div>
      <div class="corrente">
        <div class="ora" id="ora">—</div>
        <div class="poi" id="poi"></div>
      </div>
      <h2 data-t="Scaletta">Scaletta</h2>
      <ol class="voci" id="voci"></ol>
    </div>
  </div>
</div>

<script type="application/json" id="configurazione">__CONFIG__</script>
<script>__JS__</script>
</body>
</html>
